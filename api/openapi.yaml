  /api/services/{id}/logs:
    get:
      operationId: getServiceLogs
      summary: Stream a running container's logs via SSE
      description: |
        Returns a Server-Sent Events stream of the service's container output,
        starting with the last 200 lines and then following live. OpenAPI does
        not natively model SSE, so this endpoint is documented for reference only.

        Unlike deployment logs these are not stored by Uploy — Docker holds the
        history, so a reconnect re-tails rather than resuming.

        **SSE events (not modeled by this schema):**
        - Default message event: JSON object with "output" and "type" ("stdout" or "stderr")
        - `done` event: the container's stream ended
        - `stream-error` event: JSON object with "message" field
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: >-
            Only replay history from this far back. Omitted, the stream starts
            from the last 200 lines however old they are.
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d, 30d]
      responses:
        "200":
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Service has not been deployed yet, or `since` is not one of the listed values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
