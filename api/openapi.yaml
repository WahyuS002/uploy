      summary: Store an SSH private key
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSSHKeyRequest"
      responses:
        "201":
          description: SSH key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKeyResponse"
        "400":
          description: Invalid request or key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listSSHKeys
      summary: List stored SSH keys
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of SSH keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SSHKeyResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/ssh-keys/generate:
    post:
      operationId: generateSSHKey
      summary: Generate a new Ed25519 SSH keypair
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSSHKeyRequest"
      responses:
        "201":
          description: SSH keypair generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKeyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  schemas:
    NotificationChannelConfig:
      type: object
      additionalProperties: true

    NotificationChannelType:
      type: string
      enum:
        - discord
        - slack
        - telegram
        - email
        - webhook

    CreateNotificationChannelRequest:
      type: object
      required:
        - name
        - type
        - config
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/NotificationChannelType"
        config:
          $ref: "#/components/schemas/NotificationChannelConfig"

    UpdateNotificationChannelRequest:
      allOf:
        - $ref: "#/components/schemas/CreateNotificationChannelRequest"
        - type: object
          properties:
            enabled:
              type: boolean

    NotificationChannelResponse:
      type: object
      required:
        - id
        - name
        - type
        - enabled
        - config
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/NotificationChannelType"
        enabled:
          type: boolean
        config:
          $ref: "#/components/schemas/NotificationChannelConfig"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertCondition:
      type: string
      enum:
        - cpu_high
        - memory_high
        - disk_low
        - service_down
        - server_unreachable

    AlertScopeType:
      type: string
      enum:
        - server
        - service

    CreateAlertRuleRequest:
      type: object
      required:
        - name
        - condition
        - threshold
        - duration_seconds
        - scope_type
        - channel_ids
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        condition:
          $ref: "#/components/schemas/AlertCondition"
        threshold:
          type: number
          format: double
          minimum: 0
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
        scope_type:
          $ref: "#/components/schemas/AlertScopeType"
        server_id:
          type: string
        service_id:
          type: string
        channel_ids:
          type: array
          items:
            type: string

    UpdateAlertRuleRequest:
      allOf:
        - $ref: "#/components/schemas/CreateAlertRuleRequest"
        - type: object
          properties:
            enabled:
              type: boolean

    AlertRuleResponse:
      type: object
      required:
        - id
        - name
        - condition
        - threshold
        - duration_seconds
        - scope_type
        - channel_ids
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        condition:
          $ref: "#/components/schemas/AlertCondition"
        threshold:
          type: number
          format: double
        duration_seconds:
          type: integer
        scope_type:
          $ref: "#/components/schemas/AlertScopeType"
        server_id:
          type: string
        service_id:
          type: string
        channel_ids:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertEventResponse:
      type: object
      required:
        - id
        - rule_id
        - target_id
        - target_name
        - status
        - started_at
        - trigger_value
      properties:
        id:
          type: string
        rule_id:
          type: string
        target_id:
          type: string
        target_name:
          type: string
        status:
          type: string
          enum:
            - firing
            - resolved
        started_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        trigger_value:
          type: number
          format: double
        resolved_value:
          type: number
          format: double
        duration_seconds:
          type: integer

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    User:
      type: object
      required:
        - id
        - email
        - platform_role
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        platform_role:
          type: string

    Workspace:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string

    AuthResponse:
      type: object
      required:
        - user
        - workspace
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"

    LogoutResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean

    DeployRequest:
      type: object
      required:
        - service_id
      properties:
        service_id:
          type: string

    DeployResponse:
      type: object
      required:
        - deployment_id
      properties:
        deployment_id:
          type: string

    DeploymentResponse:
      type: object
      required:
        - id
        - status
        - service_id
        - created_at
        - phase
        - is_active
        - is_draining
        - is_rolling
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - in_progress
            - success
            - failed
        service_id:
          type: string
        created_at:
          type: string
          format: date-time
        phase:
          type: string
        is_active:
          type: boolean
        is_draining:
          type: boolean
        is_rolling:
          type: boolean

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          description: >
            Machine-readable failure stage. Present on SSH probe failures so a
            client can offer the right remedy: the three stages need entirely
            different fixes, and the human message alone cannot be branched on.
          enum:
            - unreachable
            - key_rejected
            - key_invalid
            - session_failed
            - docker_missing

    CreateSSHKeyRequest:
      type: object
      required:
        - name
        - private_key
      properties:
        name:
          type: string
        private_key:
          type: string

    GenerateSSHKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CheckConnectionRequest:
      type: object
      required:
        - host
        - ssh_user
        - ssh_key_id
      properties:
        host:
          type: string
        port:
          type: integer
          default: 22
        ssh_user:
          type: string
        ssh_key_id:
          type: string

    CheckConnectionResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean

    SSHKeyResponse:
      type: object
      required:
        - id
        - name
        - public_key
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        public_key:
          type: string
          description: "OpenSSH authorized_keys format public key derived from the stored private key"
        created_at:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required:
        - name
        - host
        - ssh_user
        - ssh_key_id
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
          default: 22
        ssh_user:
          type: string
        ssh_key_id:
          type: string

    ServerResponse:
      type: object
      required:
        - id
        - name
        - host
        - port
        - ssh_user
        - ssh_key_id
        - proxy_status
        - monitoring
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        ssh_user:
          type: string
        ssh_key_id:
          type: string
        proxy_status:
          type: string
          enum:
            - not_configured
            - ready
            - port_conflict
            - degraded
        proxy_last_reconciled_at:
          type: string
          format: date-time
        proxy_last_error:
          type: string
        monitoring:
          $ref: "#/components/schemas/ServerMonitoringResponse"
        created_at:
          type: string
          format: date-time

    ConfigureServerMonitoringRequest:
      type: object
      required:
        - private_address
      properties:
        private_address:
          type: string
          description: RFC1918, IPv6 ULA, or CGNAT address reachable by the control plane.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 9184
        retention_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        fqdn:
          type: string
          description: Optional public FQDN. Uploy routes it through Traefik with HTTPS.
        reader_token:
          type: string
          format: password
          minLength: 32
          description: Optional external read token. Omit only when updating an already configured server.

    ServerMonitoringResponse:
      type: object
      required:
        - enabled
        - port
        - retention_days
        - private_address
        - status
      properties:
        enabled:
          type: boolean
        port:
          type: integer
        retention_days:
          type: integer
        private_address:
          type: string
        fqdn:
          type: string
        status:
          type: string
          enum: [disabled, provisioning, ready, error]
        last_reconciled_at:
          type: string
          format: date-time
        last_error:
          type: string
        cleanup_at:
          type: string
          format: date-time

    LogEntry:
      type: object
      required:
        - id
        - order
        - created_at
        - output
        - type
        - phase
      properties:
        id:
          type: integer
          format: int64
        order:
          type: integer
        created_at:
          type: string
          format: date-time
        output:
          type: string
        type:
          type: string
          enum:
            - stdout
            - stderr
        phase:
          type: string
          description: Structured deploy phase identifier. Empty string for raw command output.

    ProjectResponse:
      type: object
      required:
        - id
        - name
        - workspace_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        workspace_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      description: |
        Request body for creating a project. When `name` is omitted, blank, or
        whitespace-only, the backend generates a unique Railway-style
        `adjective-noun` name scoped to the workspace.
      properties:
        name:
          type: string

    UpdateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CreateProjectFromImageRequest:
      type: object
      required:
        - server_id
        - image
        - container_port
      properties:
        server_id:
          type: string
        image:
          type: string
          description: Docker image reference, e.g. `nginx:latest` or `ghcr.io/owner/repo:tag`.
        container_port:
          type: integer
          description: Container port the service listens on.
        host_port:
          type: integer
          description: >-
            Host port the service is published on. Omit to keep the service
            internal — reachable by other services on the uploy network and by
            nothing outside the machine, which is what a database wants. 80 and
            443 are rejected: they belong to the Uploy proxy. Ignored while the
            service has a domain, since that traffic goes through the proxy.

    CreateProjectFromImageResponse:
      type: object
      required:
        - project
        - environment
        - service
      properties:
        project:
          $ref: "#/components/schemas/ProjectResponse"
        environment:
          $ref: "#/components/schemas/EnvironmentResponse"
        service:
          $ref: "#/components/schemas/ServiceResponse"

    EnvironmentResponse:
      type: object
      required:
        - id
        - name
        - project_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        project_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEnvironmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    UpdateEnvironmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CreateServiceRequest:
      type: object
      required:
        - name
        - image
        - container_name
        - container_port
        - server_id
        - environment_id
      properties:
        name:
          type: string
        image:
          type: string
        container_name:
          type: string
        container_port:
          type: integer
          description: Container port the image listens on.
        host_port:
          type: integer
          description: >-
            Host port the service is published on. Omit to keep the service
            internal — reachable by other services on the uploy network and by
            nothing outside the machine, which is what a database wants. 80 and
            443 are rejected: they belong to the Uploy proxy. Ignored while the
            service has a domain, since that traffic goes through the proxy.
        server_id:
          type: string
        environment_id:
          type: string
        kind:
          type: string
          default: application
          enum:
            - application

    UpdateServiceRequest:
      type: object
      required:
        - name
        - image
        - container_name
        - container_port
        - server_id
      properties:
        name:
          type: string
        image:
          type: string
        container_name:
          type: string
        container_port:
          type: integer
          description: Container port the image listens on.
        host_port:
          type: integer
          description: >-
            Host port the service is published on. Omit to keep the service
            internal — reachable by other services on the uploy network and by
            nothing outside the machine, which is what a database wants. 80 and
            443 are rejected: they belong to the Uploy proxy. Ignored while the
            service has a domain, since that traffic goes through the proxy.
        server_id:
          type: string

    ServiceResponse:
      type: object
      required:
        - id
        - name
        - image
        - container_name
        - container_port
        - server_id
        - kind
        - project_id
        - environment_id
        - created_at
        - updated_at
        - pending_change_count
        - has_deployed
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        container_name:
          type: string
        container_port:
          type: integer
          description: Container port the image listens on.
        host_port:
          type: integer
          description: >-
            Host port the service is published on. Omit to keep the service
            internal — reachable by other services on the uploy network and by
            nothing outside the machine, which is what a database wants. 80 and
            443 are rejected: they belong to the Uploy proxy. Ignored while the
            service has a domain, since that traffic goes through the proxy.
        server_id:
          type: string
        kind:
          type: string
          enum:
            - application
        project_id:
          type: string
        environment_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pending_change_count:
          type: integer
          description: >
            How many changes are waiting to be deployed: the difference between
            the service's current configuration and the configuration its last
            successful deployment actually shipped, counted per field, per
            domain and per variable. Zero means the running container matches
            what the service says it is.

            A service with nothing to compare against — never deployed, or last
            deployed before Uploy recorded configurations — reports 1. It is
            pending, but there is no itemised answer to give.

            Derived per request, never stored.
        has_deployed:
          type: boolean
          description: >
            True once at least one deployment of this service has succeeded.
            Combined with has_pending_changes it distinguishes a service that
            will be created on its server from one that will be updated.
            Derived per request, never stored.

    ProjectObservabilityResponse:
      type: object
      required:
        - sampled_at
        - refresh_after_seconds
        - summary
        - services
      properties:
        sampled_at:
          type: string
          format: date-time
        refresh_after_seconds:
          type: integer
          description: Recommended client refresh interval.
        summary:
          $ref: "#/components/schemas/ProjectObservabilitySummary"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceObservability"

    ProjectObservabilityHistoryResponse:
      type: object
      required:
        - services
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceObservabilityHistory"

    ServiceObservabilityHistory:
      type: object
      required:
        - service_id
        - name
        - deployments
      properties:
        service_id:
          type: string
        name:
          type: string
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentObservabilityHistory"

    DeploymentObservabilityHistory:
      type: object
      required:
        - deployment_id
        - points
      properties:
        deployment_id:
          type: string
        unavailable_reason:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/ContainerObservabilitySample"

    ContainerObservabilitySample:
      type: object
      required:
        - sampled_at
        - container_id
        - container_name
        - state
        - cpu_percent
        - memory_used_bytes
        - memory_limit_bytes
        - network_in_bytes_total
        - network_out_bytes_total
        - uptime_seconds
      properties:
        sampled_at:
          type: string
          format: date-time
        container_id:
          type: string
        container_name:
          type: string
        state:
          type: string
        cpu_percent:
          type: number
          format: double
        memory_used_bytes:
          type: integer
          format: int64
        memory_limit_bytes:
          type: integer
          format: int64
        network_in_bytes_total:
          type: integer
          format: int64
        network_out_bytes_total:
          type: integer
          format: int64
        uptime_seconds:
          type: integer
          format: int64

    ProjectObservabilitySummary:
      type: object
      required:
        - total_services
        - running_services
        - degraded_services
        - cpu_percent
        - memory_used_bytes
        - memory_limit_bytes
        - network_in_bytes_total
        - network_out_bytes_total
      properties:
        total_services:
          type: integer
        running_services:
          type: integer
        degraded_services:
          type: integer
        cpu_percent:
          type: number
          format: double
        memory_used_bytes:
          type: integer
          format: int64
        memory_limit_bytes:
          type: integer
          format: int64
        network_in_bytes_total:
          type: integer
          format: int64
        network_out_bytes_total:
          type: integer
          format: int64

    ServiceObservability:
      type: object
      required:
        - service_id
        - name
        - environment_name
        - status
      properties:
        service_id:
          type: string
        name:
          type: string
        environment_name:
          type: string
        status:
          type: string
          enum:
            - not_deployed
            - running
            - stopped
            - unreachable
            - error
        deployment_id:
          type: string
        error:
          type: string
        container:
          $ref: "#/components/schemas/ContainerObservability"

    ContainerObservability:
      type: object
      required:
        - id
        - name
        - state
        - cpu_percent
        - memory_used_bytes
        - memory_limit_bytes
        - network_in_bytes_total
        - network_out_bytes_total
        - uptime_seconds
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
        cpu_percent:
          type: number
          format: double
        memory_used_bytes:
          type: integer
          format: int64
        memory_limit_bytes:
          type: integer
          format: int64
        network_in_bytes_total:
          type: integer
          format: int64
        network_out_bytes_total:
          type: integer
          format: int64
        uptime_seconds:
          type: integer
          format: int64

    ConfigChange:
      type: object
      required:
        - key
        - label
        - type
      properties:
        key:
          type: string
          description: >
            Stable identifier for this change, unique within the list —
            "image", "domain:app.example.com", "env:DATABASE_URL".
        label:
          type: string
          description: What the change is called in the interface.
        type:
          type: string
          enum:
            - added
            - removed
            - changed
        old_value:
          type: string
          description: Absent when the thing did not exist before.
        new_value:
          type: string
          description: Absent when the thing no longer exists.

    PendingChangesResponse:
      type: object
      required:
        - has_baseline
        - changes
      properties:
        has_baseline:
          type: boolean
          description: >
            False when there is no deployed configuration to compare against:
            the service has never deployed, or last deployed before Uploy
            recorded configurations. The service is pending either way, but
            changes is empty because no itemised answer exists — say so rather
            than showing an empty list under a badge that says otherwise.
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ConfigChange"

    CreateDomainRequest:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string

    UpdateDomainRequest:
      type: object
      required:
        - is_primary
      properties:
        is_primary:
          type: boolean

    ServiceDomainResponse:
      type: object
      required:
        - id
        - domain
        - is_primary
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        domain:
          type: string
        is_primary:
          type: boolean
        status:
          type: string
          enum:
            - pending
            - ready
            - error
        last_error:
          type: string
        last_reconciled_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
        next_check_at:
          type: string
          format: date-time
          description: >-
            When the reconciler next examines pending domains. A domain cannot
            change status between two of those passes, so this is the moment a
            client should wait for. Absent once the domain is ready, or if the
            reconciler is not running.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpsertEnvRequest:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string

    ServiceEnvResponse:
      type: object
      required:
        - id
        - key
        - value
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        value:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
